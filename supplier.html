<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f4f4" />
  <title>Supplier vetting · Company Evidence Index</title>
  <link rel="stylesheet" href="cal-hacks-tokens.css?v=11" />
  <link rel="stylesheet" href="styles.css?v=28" />
</head>
<body>
  <header class="topbar"></header>
  <script src="/navigation.js?v=1"></script>
  <script src="/role.js?v=1" defer></script>
  <main id="overview">
    <div class="dash-head">
      <div>
        <h1 class="dash-title">Vet any company</h1>
      </div>
    </div>
    <section class="panel" aria-label="Supplier search">
      <form id="vet-form" class="vet-form">
        <span class="vet-field"><label for="vet-name">Supplier name</label><input id="vet-name" name="name" type="text" value="Honeybee Robotics" autocomplete="off" /></span>
        <button type="submit" id="vet-go" class="outline-button">Build evidence pack</button>
      </form>
    </section>
    <section class="panel" aria-label="Award history">
      <div class="section-heading"><div><p class="overline">FEDERAL AWARD HISTORY</p><h2>USASpending records</h2></div><span class="badge-dim" id="award-count"></span></div>
      <div id="awards"><p class="state-note">Enter a supplier to fetch live records.</p></div>
    </section>
    <section class="panel" aria-label="NASA citations">
      <div class="section-heading"><div><p class="overline">TECHNICAL LITERATURE</p><h2>NASA technical reports</h2></div><span class="badge-dim" id="citation-count"></span></div>
      <div id="citations"><p class="state-note">Fetched with the pack.</p></div>
    </section>
    <section class="panel" aria-label="Read this pack carefully">
      <div class="section-heading"><div><p class="overline">HOW TO READ THIS</p><h2>Limits and planned connectors</h2></div></div>
      <div id="caveats"></div>
      <div id="connectors"></div>
    </section>
  </main>
  <script src="supplier.js?v=2"></script>
</body>
</html>
