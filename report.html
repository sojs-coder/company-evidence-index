<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f4f4" />
  <title>Apple Inc. · Company Evidence Index</title>
  <link rel="stylesheet" href="cal-hacks-tokens.css?v=11" />
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="Open home"><span class="mark">O</span><span>open<span class="wordmark-period">.</span></span></a>
    <nav class="main-nav" aria-label="Primary navigation">
      <a class="nav-link" href="/">Companies</a>
      <a class="nav-link" href="/collection.html">Collection</a>
      <a class="nav-link" href="/results.html">Results</a>
      <a class="nav-link active" href="/report.html">Report</a>
    </nav>
    <div class="top-actions"><span class="snapshot-state"><i></i> Live</span><button class="theme-toggle" aria-label="Switch color theme" title="Switch theme"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.2a5.8 5.8 0 0 1 0 11.6z" fill="currentColor"/></svg></button></div>
  </header>
  <main id="overview">
    <div class="dash-head">
      <div>
        <p class="page-kicker"><span>COMPANY REPORT</span><span class="kicker-rule"></span><span id="run-stamp">RUNNING</span></p>
        <h1 class="dash-title">Apple Inc. <span class="ticker">AAPL</span></h1>
      </div>
      <div class="dash-badges" id="run-badges"></div>
    </div>
    <section id="run-summary" class="metric-row" aria-label="Run summary"></section>
    <section class="bottom-section" aria-label="Latest collected evidence">
      <div class="section-heading"><div><p class="overline">EVIDENCE STREAM</p><h2>Latest collected items</h2></div><a class="text-button" href="/collection.html">By source <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h10M9 3.5 13 8l-4 4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a></div>
      <div class="table-head stream-head"><span>SOURCE</span><span>ITEM</span><span>DATE</span></div>
      <ul id="evidence-stream" class="stream-list"></ul>
    </section>
    <section class="bottom-section" aria-label="Volume by source">
      <div class="section-heading"><div><p class="overline">BY SOURCE</p><h2>Collected volume</h2></div></div>
      <div id="run-graph" class="util-graph"></div>
      <p id="run-history" class="chart-caption"></p>
    </section>
    <section class="bottom-section" aria-label="Claim checks">
      <div class="section-heading"><div><p class="overline">CLAIM CHECKS</p><h2>Statements and citations</h2></div></div>
      <div id="claim-checks" class="check-list"></div>
      <p class="chart-caption" id="check-method"></p>
    </section>
    <p class="chart-caption foot-note" id="foot-note"></p>
  </main>
  <script src="report.js?v=17"></script>
</body>
</html>
