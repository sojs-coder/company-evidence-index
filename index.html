<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f4f4" />
  <title>Vet any company · Company Evidence Index</title>
  <link rel="stylesheet" href="cal-hacks-tokens.css?v=12" />
  <link rel="stylesheet" href="styles.css?v=30" />
  <link rel="stylesheet" href="brief.css?v=2" />
</head>
<body class="vet-page" data-no-role-gate>
  <header class="topbar"></header>
  <script src="/navigation.js?v=1"></script>
  <script src="/role.js?v=1" defer></script>
  <main id="overview">
    <div class="dash-head">
      <div>
        <h1 class="dash-title">Vet any company</h1>
      </div>
    </div>
    <section class="panel" aria-label="Vetting request">
      <p class="vet-intro">Pick a company and who you are. Ask the question you are deciding on. Get a cited brief from the evidence already on file, with its limits in plain sight.</p>
      <form id="pick-form" class="vet-form pick-form">
        <span class="vet-field"><label for="pick-company">Company</label>
          <select id="pick-company" name="company">
            <option value="AAPL">Apple</option><option value="MSFT">Microsoft</option><option value="AMZN">Amazon</option><option value="GOOGL">Alphabet</option><option value="NVDA">Nvidia</option>
          </select></span>
        <fieldset class="vet-field pick-roles"><legend>You are</legend>
          <label><input type="radio" name="role" value="customer"> Customer</label>
          <label><input type="radio" name="role" value="vendor"> Vendor</label>
          <label><input type="radio" name="role" value="investor"> Investor</label>
          <label><input type="radio" name="role" value="scout" checked> Scout</label>
        </fieldset>
        <span class="vet-field vet-field--q"><label for="pick-question">Your evaluation question</label><textarea id="pick-question" name="question" rows="2"></textarea></span>
        <button type="submit" class="outline-button">Open brief</button>
      </form>
      <p class="faint">The role sets the default question and what leads the brief. Same posts, same sources, same standards for everyone.</p>
    </section>
  </main>
  <script src="/pick.js?v=2"></script>

</body>
</html>
